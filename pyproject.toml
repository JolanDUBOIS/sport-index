[project]
name = "sport-index"
version = "0.3.1"
description = "Unified clients for sports data providers"
authors = [
    {name = "JolanDUBOIS", email = "jolan.developer@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "cloudscraper (>=1.2.71,<2.0.0)",
    "pycountry (>=26.2.16,<27.0.0)"
]

[tool.poetry]
packages = [{ include = "sportindex", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.1.0,<8.0.0)",
    "mkdocs-material (>=9.7.6,<10.0.0)",
    "mkdocstrings[python] (>=1.0.3,<2.0.0)",
    "mike (>=2.1.4,<3.0.0)"
]
