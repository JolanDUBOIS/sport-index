[project]
name = "sport-index"
version = "0.8.0"
description = "Unified clients for sports data providers"
authors = [
    {name = "JolanDUBOIS", email = "jolan.developer@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"

dependencies = [
    "requests>=2.32.5,<3.0.0",
    "beautifulsoup4>=4.14.3,<5.0.0",
    "cloudscraper>=1.2.71,<2.0.0",
    "pycountry>=26.2.16,<27.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "nameparser>=1.1.3,<2.0.0",
    "typing-extensions>=4.15.0,<5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sportindex"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "ipykernel>=7.1.0,<8.0.0",
    "mkdocs-material>=9.7.6,<10.0.0",
    "mkdocstrings[python]>=1.0.3,<2.0.0",
    "mike>=2.1.4,<3.0.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
log_level = "DEBUG"
log_format = "%(asctime)s [%(levelname)8s] (%(filename)s:%(lineno)s) %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 88 

[tool.ruff.lint]
select = [
    "F", "E", "W", "B", "UP", "I", "FA", "C4", "SIM", 
    "RET", "RSE", "PIE", "N", "PTH", "TC", "S", "BLE"
]

ignore = ["D", "E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
