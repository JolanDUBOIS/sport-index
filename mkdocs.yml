site_name: sport-index Documentation

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.version

plugins:
  - search
  - mkdocstrings

nav:
  - Home: index.md
  - API Reference: api.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

extra:
  version:
    provider: mike